<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat Web</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="container">
        <div class="hero-content">
          <div class="hero-left">
            <h1 class="brand">Chat</h1>
          </div>
          <div class="hero-meta">
            <div id="authStatus" class="auth-status">未登录</div>
          </div>
        </div>
      </div>
    </section>

    <section id="chat" class="chat card">
      <div class="chat-header">即时消息</div>
      <div id="messages" class="messages"></div>
      <form id="inputForm" class="inputForm">
        <input id="input" type="text" placeholder="输入消息并回车发送" autocomplete="off" />
        <button type="submit" class="btn primary">发送</button>
      </form>
    </section>
    <section class="download-after">
      <p class="lead">轻量、安全、随时可用的聊天服务与客户端下载中心。</p>
      <div class="cta">
        <button id="downloadAndroid" class="btn primary">下载 Android</button>
        <button id="downloadWindows" class="btn primary">下载 Windows</button>
      </div>
    </section>

    <!-- Login Modal -->
    <div id="loginModal" class="modal-overlay" aria-hidden="true">
      <div class="modal">
        <h3>登录</h3>
        <form id="loginForm" class="loginForm">
          <label>用户名
            <input id="loginUsername" type="text" autocomplete="username" />
          </label>
          <label>密码
            <input id="loginPassword" type="password" autocomplete="current-password" />
          </label>
          <div class="modal-actions">
            <button type="submit" class="btn primary">登录</button>
            <button type="button" id="loginCancel" class="btn ghost">取消</button>
          </div>
          <div id="loginError" class="login-error" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
