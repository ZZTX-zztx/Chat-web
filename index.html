<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat</title>
  <link rel="icon" type="image/x-icon" href="zaw.ico" />
  <link rel="icon" type="image/png" href="zaw.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="container">
        <div class="hero-content">
          <div class="hero-left">
            <h1 class="brand"><img class="brand-icon" src="zaw.png" alt="Logo" />Chat</h1>
          </div>
          <div class="hero-meta">
            <div id="authStatus" class="auth-status">未登录</div>
            <button id="openLoginBtn" class="btn small ghost">登录</button>
            <button id="logoutBtn" class="btn small ghost" style="display:none">退出登录</button>
            <button id="openSettingsBtn" class="btn small ghost">⚙️ 设置</button>
          </div>
        </div>
      </div>
    </section>

    <section id="chat" class="chat card">
      <div class="chat-header">即时消息</div>
      <div id="messages" class="messages"></div>
      <form id="inputForm" class="inputForm">
        <button type="button" id="btnAddMenu" class="btn add-menu-btn">+</button>
        <input id="input" type="text" placeholder="输入消息并回车发送" autocomplete="off" />
        <button type="submit" class="btn primary">发送</button>
      </form>
      
      <!-- Add Menu Dropdown -->
      <div id="addMenuDropdown" class="add-menu-dropdown">
        <button id="sendImageBtn" class="add-menu-item">
          <span class="add-menu-icon">📷</span>
          <span>发送图片</span>
        </button>
        <button id="sendLocationBtn" class="add-menu-item">
          <span class="add-menu-icon">📍</span>
          <span>发送位置</span>
        </button>
        <button id="sendFileBtn" class="add-menu-item">
          <span class="add-menu-icon">📁</span>
          <span>发送文件</span>
        </button>
        <input id="fileInput" type="file" accept="image/*,application/*" style="display:none" />
      </div>
    </section>
    <section class="download-after">
      <p class="lead">轻量、安全、随时可用的聊天服务与客户端下载中心。</p>
      <p id="platformHint" class="muted small platform-hint">检测平台...</p>
      <div class="cta">
        <button id="downloadAndroid" class="btn primary">下载 Android</button>
        <button id="downloadWindows" class="btn primary">下载 Windows</button>
      </div>
    </section>

    <!-- Login Modal -->
    <div id="loginModal" class="modal-overlay" aria-hidden="true">
      <div class="modal">
        <div class="modal-header">
          <div>
            <h3 id="authModalTitle">登录</h3>
            <p id="authModalDesc">请输入你的用户名和密码</p>
          </div>
        </div>
        <form id="authForm" class="loginForm">
          <div class="avatar-upload-container">
            <div id="avatarPreview" class="avatar-preview" style="background-image: url('zaw.png');">
              <input id="avatarInput" type="file" accept="image/*" class="avatar-input" />
              <span class="avatar-upload-hint">点击上传头像</span>
            </div>
          </div>
          <label>用户名
            <input id="authUsername" type="text" autocomplete="username" />
          </label>
          <label>密码
            <input id="authPassword" type="password" autocomplete="current-password" />
          </label>
          <div class="modal-actions">
            <button type="submit" id="authSubmit" class="btn primary">登录</button>
            <button type="button" id="authCancel" class="btn ghost">取消</button>
          </div>
          <div id="authError" class="login-error" aria-live="polite"></div>
        </form>
        <p id="authSwitch" class="small" style="text-align:center;margin-top:12px;color:var(--accent);cursor:pointer">
          还没有账号？点击注册
        </p>
      </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal-overlay" aria-hidden="true">
      <div class="modal">
        <div class="modal-header">
          <div>
            <h3>聊天设置</h3>
            <p>自定义你的聊天体验</p>
          </div>
        </div>
        <form id="settingsForm" class="loginForm">
          <div class="avatar-upload-container">
            <div id="settingsAvatarPreview" class="avatar-preview" style="background-image: url('zaw.png');">
              <input id="settingsAvatarInput" type="file" accept="image/*" class="avatar-input" />
              <span class="avatar-upload-hint">点击更改头像</span>
            </div>
          </div>
          <label>用户名
            <input id="settingsUsername" type="text" readonly />
          </label>
          <div class="modal-actions">
            <button type="submit" class="btn primary">保存</button>
            <button type="button" id="cancelSettingsBtn" class="btn ghost">取消</button>
          </div>
        </form>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
