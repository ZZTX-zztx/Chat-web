<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat Web</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Chat Web</h1>
      <p class="subtitle">网页聊天 + 一键下载安装（Android / Windows）</p>
    </header>

    <section class="download-section">
      <div class="download-left">
        <h2>下载应用</h2>
        <p id="platformHint" class="muted">检测平台...</p>
        <div class="cards">
          <div class="card" id="card-android">
            <div class="card-title">Android 版</div>
            <div class="card-desc">适用于手机和平板</div>
            <button id="downloadAndroid">下载并安装</button>
          </div>
          <div class="card" id="card-windows">
            <div class="card-title">Windows 版</div>
            <div class="card-desc">适用于桌面安装程序</div>
            <button id="downloadWindows">下载并安装</button>
          </div>
        </div>
      </div>
      <div class="download-right">
        <h3>说明</h3>
        <ul>
          <li>Android 下载：<a href="https://chat-apk.zztxer.dpdns.org" target="_blank">chat-apk.zztxer.dpdns.org</a></li>
          <li>Windows 下载：<a href="https://chat-windows.zztxer.dpdns.org" target="_blank">chat-windows.zztxer.dpdns.org</a></li>
          <li>如果浏览器阻止安装，请在设备上允许来源安装（Android）或以管理员身份运行安装程序（Windows）。</li>
        </ul>
      </div>
    </section>

    <section id="chat" class="chat">
      <div id="messages" class="messages"></div>
      <form id="inputForm" class="inputForm">
        <input id="input" type="text" placeholder="输入消息并回车发送" autocomplete="off" />
        <button type="submit">发送</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
