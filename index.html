<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat Web</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="container">
        <div class="hero-content">
          <div class="hero-left">
            <h1 class="brand">Chat</h1>
            <p class="lead">轻量、安全、随时可用的聊天服务与客户端下载中心。</p>
            <div class="cta">
              <button id="downloadAndroid" class="btn primary">下载 Android</button>
              <button id="downloadWindows" class="btn ghost">下载 Windows</button>
            </div>
            <p class="muted small">Android：chat-apk.zztxer.dpdns.org · Windows：chat-windows.zztxer.dpdns.org</p>
          </div>
          <div class="hero-right">
            <div class="device-mock">
              <div class="screen">在线聊天演示</div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="chat" class="chat card">
      <div class="chat-header">即时消息</div>
      <div id="messages" class="messages"></div>
      <form id="inputForm" class="inputForm">
        <input id="input" type="text" placeholder="输入消息并回车发送" autocomplete="off" />
        <button type="submit" class="btn primary">发送</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
